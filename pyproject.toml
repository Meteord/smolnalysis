[project]
name = "smolnalysis"
version = "0.1.0"
description = "Interactive open data analysis app for the build small hackathon."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bitsandbytes>=0.49.2",
    "gradio>=6.0,<7",
    "pandas>=2.2,<3",
    "peft>=0.19.1",
    "pydantic-settings>=2.14.1",
    "torch==2.7.1",
    "torchvision==0.22.1",
    "torchaudio==2.7.1",
    "transformers>=5.10.2",
    "trl>=1.5.1",
    "dotenv>=0.9.9",
    "jupyter>=1.1.1",
    "opentelemetry-api>=1.38.0",
    "opentelemetry-exporter-otlp>=1.38.0",
    "opentelemetry-sdk>=1.38.0",
    "truststore>=0.10.4",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cu118", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu118", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-cu118", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true
